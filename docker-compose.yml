services:
  postgres:
    image: postgres:16-alpine
    container_name: doctor-tracker-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: doctor_tracker
      POSTGRES_PASSWORD: doctor_tracker
      POSTGRES_DB: doctor_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor_tracker -d doctor_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
